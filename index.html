body {
    margin-top: 20px;
    margin-bottom: 20px;
    margin: 20px;
    background: #eee;
}

.timeline {
    width: 100%;
    position: relative;
    padding: 1px 0;
    list-style: none;
    font-weight: 500
}

.timeline .timeline-item {
    padding-left: 0;
    padding-right: 30px
}

.timeline .timeline-item.timeline-item-right,
.timeline .timeline-item:nth-of-type(even):not(.timeline-item-left) {
    padding-left: 30px;
    padding-right: 0
}

.timeline .timeline-item .timeline-event {
    width: 100%
}

.timeline:before {
    border-right-style: solid
}

.timeline:before,
.timeline:after {
    content: " ";
    display: block
}

.timeline:after {
    clear: both
}

.timeline:before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;

$(function () {
  $(".timeline-menu-btn[data-target]").on("click", function () {
    var $btn = $(this);
    $btn.toggleClass("active");
    var target = $btn.data("target");
    $("body").toggleClass("hide-" + target, !$btn.hasClass("active"));
    updateYearLabelsVisibility();
  });

  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  $("body").toggleClass("theme-dark", prefersDark);

  $("#themeToggleBtn").on("click", function () {
    $("body").toggleClass("theme-dark");
  });
});

function updateYearLabelsVisibility() {
  var hideExperience = $("body").hasClass("hide-experience");
  var hideDegree = $("body").hasClass("hide-degree");
  var $currentLabel = null;
  var hasVisible = false;

  function flush() {
    if ($currentLabel) {
      $currentLabel.toggle(hasVisible || $currentLabel.hasClass("timeline-label-marker"));
    }
  }

  $(".timeline").children().each(function () {
    var $el = $(this);
    if ($el.hasClass("timeline-label-year")) {
      flush();
      $currentLabel = $el;
      hasVisible = false;
    } else if ($el.hasClass("timeline-item") && $currentLabel) {
      var isHidden =
        ($el.hasClass("type-experience") && hideExperience) ||
        ($el.hasClass("type-degree") && hideDegree);
      if (!isHidden) {
        hasVisible = true;
      }
    }
  });
  flush();
}

function start() {
  var label = htmlLabel.replace(/<!--label-->/, "@" + user);
  label = label.replace(/bg-secondary/, "bg-primary");
  $(".timeline").append(label);

  personalinfo(DATA);
}

function toDate(dt) {


  try{

    var date = dt
    .toLowerCase()
    .replace("jan", "01")
    .replace("fev", "02")
    .replace("mar", "03")
    .replace("abr", "04")
    .replace("mai", "05")
    .replace("jun", "06")
    .replace("jul", "07")
    .replace("ago", "08")
    .replace("set", "09")
    .replace("out", "10")
    .replace("nov", "11")
    .replace("dez", "12")
    .split("/");

    var _dt = new Date(Date.UTC(date[1], date[0]));
    
    return isNaN(_dt) ? new Date(Date.now()) : _dt ;
  } catch(e){
    return new Date(Date.now());
  }

}

function skills(data) {
  data.experience.forEach((e)=> e.type = "experience");
  data.degree.forEach((e)=> e.type = "degree");

  _items = [...data.experience, ...data.degree];
  _items.forEach(function(e){
    e.dateLabel = e.start + " - " + e.end;
    e.isOngoing = e.end === "Atual";
    e.start = toDate(e.start);
    e.end = toDate(e.end);
  });
  _items = _items.sort((a,b)=>b.start-a.start);

  var ongoing = _items.find((e)=>e.isOngoing);
  var earliest = _items[_items.length - 1];
  var groupYear = (e)=>{
    var y = e.end.getFullYear();
    if(ongoing && !e.isOngoing && y > ongoing.start.getFullYear()){
      return ongoing.end.getFullYear();
    }
    return y;
  };

  _itemsGroup = _items.map(groupYear);
  _itemsGroup = [...new Set(_itemsGroup)]
  .sort(function(a,b){return b-a})
  .map((e)=>{
    return {
      year: e,
      items: _items
        .filter((i)=>groupYear(i) == e)
        .sort((a,b)=>(b.isOngoing - a.isOngoing) || (b.end - a.end))
    } ;
  });

  var startYear = earliest.start.getFullYear();
  if(_itemsGroup[_itemsGroup.length - 1].year !== startYear){
    _itemsGroup.push({ year: startYear, items: [] });
  }

  experience(data);
}
